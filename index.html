<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasabyahe App Interface Presentation</title>
  <style>
    :root {
      --primary-navy: #032B5B;
      --secondary-teal: #00B4A2;
      --accent-yellow: #FFB800;
      --bg-light: #F4F7FA;
      --card-bg: #FFFFFF;
      --text-dark: #1E293B;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      color: #ffffff;
      margin-bottom: 20px;
      max-width: 600px;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--secondary-teal);
    }

    .header p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-top: 4px;
    }

    /* Phone Frame */
    .phone-frame {
      width: 100%;
      max-width: 380px;
      height: 740px;
      background: var(--bg-light);
      border: 10px solid #1e293b;
      border-radius: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Status Bar */
    .status-bar {
      height: 28px;
      background: var(--primary-navy);
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      font-size: 0.75rem;
      font-weight: 600;
      z-index: 100;
    }

    /* Notification Banner */
    .notification-banner {
      background: #38bdf8;
      color: #0f172a;
      padding: 10px 14px;
      font-size: 0.75rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      animation: slideDown 0.3s ease-out;
    }
